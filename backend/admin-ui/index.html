<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Admin — TheDriftHub CMS</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --sidebar-w: 220px;
      --ink: #0a0a0a;
      --canvas: #ffffff;
      --surface: #f5f5f5;
      --surface-2: #ebebeb;
      --border: #e2e2e2;
      --mute: #666;
      --accent: #2563eb;
      --accent-2: #1d4ed8;
      --cyan: #0284c7;
      --success: #16a34a;
      --warning: #d97706;
      --danger: #dc2626;
      --sidebar-bg: #0d0d0d;
      --sidebar-text: #a1a1aa;
      --sidebar-active: #ffffff;
      --sidebar-hover: #1a1a1a;
      --grad: linear-gradient(135deg, #2563eb, #1d4ed8);
      --radius: 8px;
      --shadow: 0 1px 3px rgba(0,0,0,.08), 0 1px 2px rgba(0,0,0,.06);
      --shadow-md: 0 4px 6px -1px rgba(0,0,0,.1), 0 2px 4px -1px rgba(0,0,0,.06);
    }

    html, body { height: 100%; font-family: 'Inter', system-ui, -apple-system, sans-serif; background: var(--surface); color: var(--ink); }

    /* ── Sidebar */
    .sidebar {
      position: fixed; top: 0; left: 0; bottom: 0;
      width: var(--sidebar-w);
      background: var(--sidebar-bg);
      display: flex; flex-direction: column;
      z-index: 100;
      border-right: 1px solid #1f1f1f;
    }
    .sidebar-logo { padding: 20px 16px 16px; border-bottom: 1px solid #1f1f1f; }
    .sidebar-logo-text { font-size: 15px; font-weight: 800; letter-spacing: -0.5px; text-transform: uppercase; color: #fff; }
    .sidebar-logo-text span { background: var(--grad); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
    .sidebar-logo-sub { font-size: 10px; color: #555; letter-spacing: .05em; text-transform: uppercase; margin-top: 2px; }
    .sidebar-nav { flex: 1; padding: 12px 8px; display: flex; flex-direction: column; gap: 2px; }
    .nav-item {
      display: flex; align-items: center; gap: 10px;
      padding: 9px 10px; border-radius: 6px; cursor: pointer;
      font-size: 13px; font-weight: 500; color: var(--sidebar-text);
      transition: all .15s; border: none; background: none; width: 100%; text-align: left;
    }
    .nav-item:hover { background: var(--sidebar-hover); color: var(--sidebar-active); }
    .nav-item.active { background: #1e1e1e; color: #fff; }
    .nav-item svg { width: 16px; height: 16px; flex-shrink: 0; }
    .sidebar-bottom { padding: 12px 8px; border-top: 1px solid #1f1f1f; }
    .sidebar-badge {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 4px 8px; background: #1a1a1a; border-radius: 20px;
      font-size: 11px; color: #555; font-weight: 500;
    }
    .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--success); animation: pulse 2s infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.5} }

    /* ── Main */
    .main { margin-left: var(--sidebar-w); min-height: 100vh; display: flex; flex-direction: column; }
    .topbar {
      position: sticky; top: 0; z-index: 50;
      background: var(--canvas); border-bottom: 1px solid var(--border);
      padding: 0 24px; height: 52px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .topbar-title { font-size: 14px; font-weight: 600; color: var(--ink); }
    .topbar-actions { display: flex; align-items: center; gap: 8px; }
    .content { padding: 24px; flex: 1; max-width: 1200px; }

    /* ── Buttons */
    .btn {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 7px 14px; border-radius: var(--radius); font-size: 13px;
      font-weight: 600; cursor: pointer; border: none; transition: all .15s;
      font-family: inherit; white-space: nowrap; text-decoration: none;
    }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-primary:hover { background: #6d28d9; }
    .btn-secondary { background: var(--surface); color: var(--ink); border: 1px solid var(--border); }
    .btn-secondary:hover { background: var(--surface-2); }
    .btn-danger { background: #fef2f2; color: var(--danger); border: 1px solid #fecaca; }
    .btn-danger:hover { background: #fee2e2; }
    .btn-sm { padding: 5px 10px; font-size: 12px; }
    .btn-grad { background: var(--grad); color: #fff; }
    .btn-grad:hover { opacity: .9; }
    .btn:disabled { opacity: .5; cursor: not-allowed; }

    /* ── Cards */
    .card { background: var(--canvas); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); }
    .card-body { padding: 20px; }
    .card-header { padding: 14px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
    .card-title { font-size: 13px; font-weight: 600; }

    /* ── Stat cards */
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px,1fr)); gap: 12px; margin-bottom: 24px; }
    .stat-card { background: var(--canvas); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; }
    .stat-label { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; color: var(--mute); margin-bottom: 6px; }
    .stat-value { font-size: 28px; font-weight: 800; color: var(--ink); letter-spacing: -1px; }

    /* ── Table */
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th { padding: 10px 14px; text-align: left; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; color: var(--mute); border-bottom: 1px solid var(--border); background: var(--surface); }
    td { padding: 12px 14px; border-bottom: 1px solid var(--border); vertical-align: middle; }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: var(--surface); }

    /* ── Badges */
    .badge {
      display: inline-flex; align-items: center;
      padding: 2px 8px; border-radius: 20px; font-size: 11px; font-weight: 600;
    }
    .badge-tech { background: #ecfeff; color: #0e7490; }
    .badge-memes { background: #fdf2f8; color: #be185d; }
    .badge-creators { background: #f5f3ff; color: #6d28d9; }
    .badge-movies { background: #fffbeb; color: #b45309; }
    .badge-featured { background: #f0fdf4; color: #15803d; }
    .badge-trending { background: #fff7ed; color: #c2410c; }
    .badge-draft { background: #f3f4f6; color: #374151; border: 1px solid #e5e7eb; }
    .badge-live { background: #ecfdf5; color: #047857; border: 1px solid #a7f3d0; }
    .badge-pending { background: #f3f4f6; color: #4b5563; border: 1px solid #e5e7eb; }
    .badge-researching { background: #e0f2fe; color: #0369a1; border: 1px solid #bae6fd; }
    .badge-writing { background: #f3e8ff; color: #7e22ce; border: 1px solid #e9d5ff; }
    .badge-auditing { background: #fef3c7; color: #b45309; border: 1px solid #fde68a; }
    .badge-image { background: #fdf2f8; color: #be185d; border: 1px solid #fbcfe8; }
    .badge-published { background: #dcfce7; color: #15803d; border: 1px solid #bbf7d0; }
    .badge-failed { background: #fee2e2; color: #b91c1c; border: 1px solid #fecaca; }

    /* ── Form elements */
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .form-group { display: flex; flex-direction: column; gap: 5px; }
    .form-group.full { grid-column: 1 / -1; }
    label.form-label { font-size: 12px; font-weight: 600; color: #444; }
    input, select, textarea {
      padding: 8px 11px; border: 1px solid var(--border); border-radius: 6px;
      font-size: 13px; font-family: inherit; color: var(--ink); background: var(--canvas);
      transition: border-color .15s; width: 100%;
    }
    input::placeholder, textarea::placeholder {
      color: #9ca3af;
      font-style: italic;
      opacity: 0.85;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    #ai-topics-input {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      font-size: 13px;
      line-height: 1.6;
    }
    input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 2px rgba(124,58,237,.12); }
    textarea { resize: vertical; min-height: 70px; }
    .char-counter { font-size: 11px; text-align: right; margin-top: 2px; }
    .char-ok { color: var(--success); }
    .char-warn { color: var(--warning); }
    .char-bad { color: var(--danger); }

    /* ── Toggle */
    .toggle-row { display: flex; align-items: center; gap: 8px; cursor: pointer; }
    .toggle {
      width: 36px; height: 20px; border-radius: 10px; background: var(--border);
      position: relative; transition: background .2s; cursor: pointer; border: none; flex-shrink: 0;
    }
    .toggle.on { background: var(--accent); }
    .toggle::after {
      content: ''; position: absolute; top: 2px; left: 2px;
      width: 16px; height: 16px; border-radius: 50%; background: #fff;
      transition: transform .2s; box-shadow: 0 1px 2px rgba(0,0,0,.2);
    }
    .toggle.on::after { transform: translateX(16px); }

    /* ── SEO Panel */
    .seo-panel { background: var(--canvas); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; }
    .seo-score-ring {
      width: 64px; height: 64px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px; font-weight: 800; flex-shrink: 0; border: 3px solid;
    }
    .seo-score-good { border-color: var(--success); color: var(--success); }
    .seo-score-ok { border-color: var(--warning); color: var(--warning); }
    .seo-score-bad { border-color: var(--danger); color: var(--danger); }
    .seo-check { display: flex; align-items: flex-start; gap: 8px; font-size: 12px; padding: 5px 0; border-bottom: 1px solid var(--surface); }
    .seo-check:last-child { border-bottom: none; }
    .seo-icon { font-size: 13px; flex-shrink: 0; margin-top: 1px; }

    /* ── Tags */
    .tags-wrap { display: flex; flex-wrap: wrap; gap: 6px; padding: 6px; border: 1px solid var(--border); border-radius: 6px; min-height: 38px; background: var(--canvas); cursor: text; }
    .tags-wrap:focus-within { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(124,58,237,.12); }
    .tag-chip { display: flex; align-items: center; gap: 4px; padding: 2px 8px; background: #f5f3ff; color: #6d28d9; border-radius: 20px; font-size: 12px; font-weight: 500; }
    .tag-chip button { background: none; border: none; cursor: pointer; color: #6d28d9; font-size: 14px; line-height: 1; padding: 0; }
    .tag-input { border: none !important; outline: none !important; font-size: 13px; font-family: inherit; background: transparent !important; min-width: 100px; flex: 1; padding: 2px 4px !important; box-shadow: none !important; }

    /* ── Search */
    .search-wrap { position: relative; }
    .search-wrap input { padding-left: 32px; }
    .search-icon { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--mute); pointer-events: none; }

    /* ── Empty state */
    .empty { text-align: center; padding: 48px 24px; color: var(--mute); }
    .empty-icon { font-size: 40px; margin-bottom: 12px; }
    .empty h3 { font-size: 15px; font-weight: 600; color: var(--ink); margin-bottom: 4px; }
    .empty p { font-size: 13px; }

    /* ── Toast */
    .toast-container { position: fixed; bottom: 20px; right: 20px; z-index: 999; display: flex; flex-direction: column; gap: 8px; }
    .toast {
      padding: 12px 16px; border-radius: var(--radius); font-size: 13px; font-weight: 500;
      box-shadow: var(--shadow-md); display: flex; align-items: center; gap: 8px;
      animation: slideIn .2s ease;
    }
    @keyframes slideIn { from { transform: translateX(100%); opacity:0 } to { transform: translateX(0); opacity:1 } }
    .toast-success { background: #f0fdf4; color: #15803d; border: 1px solid #bbf7d0; }
    .toast-error { background: #fef2f2; color: var(--danger); border: 1px solid #fecaca; }

    /* ── Editor layout */
    .editor-layout { display: grid; grid-template-columns: 1fr 320px; gap: 16px; align-items: start; }
    .editor-main { display: flex; flex-direction: column; gap: 14px; }

    /* ── MD editor toolbar */
    .md-toolbar { display: flex; gap: 2px; padding: 6px 8px; border-bottom: 1px solid var(--border); background: var(--surface); border-radius: 6px 6px 0 0; flex-wrap: wrap; }
    .md-toolbar button {
      padding: 4px 8px; border: none; background: none; cursor: pointer; border-radius: 4px;
      font-size: 13px; color: var(--mute); transition: all .15s; font-family: inherit;
    }
    .md-toolbar button:hover { background: var(--canvas); color: var(--ink); }
    .md-toolbar .sep { width: 1px; background: var(--border); margin: 2px 4px; }
    .md-textarea {
      border-radius: 0 0 6px 6px !important; border-top: none !important;
      min-height: 320px; font-family: 'Courier New', monospace; font-size: 13px; line-height: 1.6;
    }

    /* ── Overlay / Dialog */
    .overlay { position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 200; display: flex; align-items: center; justify-content: center; }
    .dialog { background: var(--canvas); border-radius: 12px; padding: 24px; max-width: 380px; width: 90%; box-shadow: 0 20px 40px rgba(0,0,0,.2); }
    .dialog h3 { margin-bottom: 8px; font-size: 14px; font-weight: 700; }
    .dialog p { font-size: 13px; color: var(--mute); margin-bottom: 20px; }
    .dialog-actions { display: flex; gap: 8px; justify-content: flex-end; }

    /* ── Upload label */
    .upload-label {
      display: inline-flex; align-items: center; gap: 6px;
      margin-top: 6px; padding: 6px 12px;
      background: var(--surface); border: 1px dashed var(--border);
      border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: 600;
      color: var(--mute); transition: all .15s; width: fit-content;
    }
    .upload-label:hover { border-color: var(--accent); }
    .upload-label input { display: none; }

    /* ── Misc */
    h2 { font-size: 18px; font-weight: 700; letter-spacing: -.3px; }
    .text-mute { color: var(--mute); font-size: 12px; }
    .flex { display: flex; } .items-center { align-items: center; } .justify-between { justify-content: space-between; }
    .gap-2 { gap: 8px; } .gap-3 { gap: 12px; } .gap-4 { gap: 16px; }
    .mb-4 { margin-bottom: 16px; } .mb-6 { margin-bottom: 24px; }
    .mt-2 { margin-top: 8px; } .mt-4 { margin-top: 16px; }
    .font-mono { font-family: 'Courier New', monospace; font-size: 12px; }
    .grad-text { background: var(--grad); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
    .spinner { width: 20px; height: 20px; border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin .6s linear infinite; display: inline-block; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .hidden { display: none !important; }
  </style>
</head>
<body>

<!-- ═══════════════════ SIDEBAR ═══════════════════ -->
<div class="sidebar">
  <div class="sidebar-logo">
    <div class="sidebar-logo-text">TheDrift<span>Hub</span></div>
    <div class="sidebar-logo-sub">Content Studio</div>
  </div>
  <div class="sidebar-nav">
    <button class="nav-item active" data-page="dashboard" onclick="navigateTo('dashboard')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
      Dashboard
    </button>
    <button class="nav-item" data-page="posts" onclick="navigateTo('posts')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14,2 14,8 20,8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
      All Posts
    </button>
    <button class="nav-item" data-page="ai-engine" onclick="navigateTo('ai-engine')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/></svg>
      AI Autopilot
    </button>
    <button class="nav-item" data-page="new" onclick="navigateTo('new')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
      New Post
    </button>
  </div>
  <div class="sidebar-bottom">
    <div class="sidebar-badge"><span class="dot"></span> CMS running</div>
  </div>
</div>

<!-- ═══════════════════ MAIN ═══════════════════ -->
<div class="main">
  <div class="topbar">
    <span class="topbar-title" id="topbar-title">Dashboard</span>
    <div class="topbar-actions">
      <span class="text-mute">localhost:3000 ↗</span>
      <a href="http://localhost:3000" target="_blank" class="btn btn-secondary btn-sm">Preview Site</a>
    </div>
  </div>

  <div class="content" id="app-content">
    <!-- Pages rendered here by JS -->
  </div>
</div>

<!-- Toast container -->
<div class="toast-container" id="toast-container"></div>

<!-- Confirm dialog (hidden by default) -->
<div class="overlay hidden" id="confirm-overlay">
  <div class="dialog">
    <h3>Are you sure?</h3>
    <p id="confirm-msg"></p>
    <div class="dialog-actions">
      <button class="btn btn-secondary btn-sm" onclick="closeConfirm()">Cancel</button>
      <button class="btn btn-danger btn-sm" id="confirm-btn" onclick="confirmAction()">Delete</button>
    </div>
  </div>
</div>

<script>
// ═══════════════════════════════════════════════════════════════════════════════
// TheDriftHub — Admin CMS (Pure Vanilla JS — zero CDN dependencies)
// ═══════════════════════════════════════════════════════════════════════════════

const API = window.location.port === '4322' ? 'http://localhost:4322/api' : '/api';
const CAT_LABELS = { 'tech-ai':'Tech & AI', 'memes-trends':'Memes & Trends', 'creators':'Creators', 'movies-ott':'Movies & OTT' };
const CAT_CLS = { 'tech-ai':'badge-tech', 'memes-trends':'badge-memes', 'creators':'badge-creators', 'movies-ott':'badge-movies' };
const TOPBAR_TITLES = { dashboard:'Dashboard', posts:'All Posts', new:'New Post', edit:'Edit Post', 'ai-engine':'AI Autopilot Studio' };

let state = {
  page: 'dashboard',
  posts: [],
  loading: true,
  editData: null,
  confirmCallback: null,
  aiConfig: null,
  aiLoading: false,
  generatingId: null,
  pollTimer: null,
  trendDiscovering: false,
  lastTrendResult: null,
  aiTopicsDraft: '',
  aiCategoryDraft: 'tech-ai',
  aiMorningDraft: null,
  aiEveningDraft: null,
  aiPexelsDraft: null,
  aiUnsplashDraft: null,
};

// ── Toast ────────────────────────────────────────────────────────────────────
function showToast(msg, type = 'success') {
  const c = document.getElementById('toast-container');
  const el = document.createElement('div');
  el.className = `toast toast-${type}`;
  el.textContent = (type === 'success' ? '✓ ' : '✕ ') + msg;
  c.appendChild(el);
  setTimeout(() => { el.style.opacity = '0'; el.style.transform = 'translateX(100%)'; setTimeout(() => el.remove(), 200); }, 3500);
}

// ── Confirm dialog ───────────────────────────────────────────────────────────
function openConfirm(msg, cb) {
  document.getElementById('confirm-msg').textContent = msg;
  document.getElementById('confirm-overlay').classList.remove('hidden');
  state.confirmCallback = cb;
}
function closeConfirm() {
  document.getElementById('confirm-overlay').classList.add('hidden');
  state.confirmCallback = null;
}
function confirmAction() {
  if (state.confirmCallback) state.confirmCallback();
  closeConfirm();
}

// ── API helpers ──────────────────────────────────────────────────────────────
async function fetchPosts() {
  try {
    const res = await fetch(`${API}/posts`);
    if (!res.ok) throw new Error();
    state.posts = await res.json();
  } catch {
    showToast('Cannot reach CMS server. Is it running?', 'error');
    state.posts = [];
  }
  state.loading = false;
}

async function fetchPost(slug) {
  const res = await fetch(`${API}/posts/${slug}`);
  if (!res.ok) throw new Error('Post not found');
  return await res.json();
}

async function deletePost(slug) {
  await fetch(`${API}/posts/${slug}`, { method: 'DELETE' });
  showToast('Post deleted');
  await fetchPosts();
  render();
}

async function uploadImage(file) {
  const fd = new FormData();
  fd.append('image', file);
  const res = await fetch(`${API}/upload`, { method: 'POST', body: fd });
  const data = await res.json();
  if (data.url) return data.url;
  throw new Error(data.error || 'Upload failed');
}

// ── Navigation ───────────────────────────────────────────────────────────────
function navigateTo(page, data) {
  if (state.pollTimer) {
    clearInterval(state.pollTimer);
    state.pollTimer = null;
  }

  // Preserve any in-progress input before switching pages
  if (state.page === 'new' || state.page === 'edit') syncEditorFromDOM();
  if (state.page === 'ai-engine') syncAIDraftsFromDOM();

  state.page = page;
  state.editData = data || null;

  if (page === 'new') {
    initEditor(null);
  } else if (page === 'edit') {
    initEditor(data);
  }

  document.querySelectorAll('.nav-item').forEach(el => {
    el.classList.toggle('active', el.dataset.page === page || (page === 'edit' && el.dataset.page === 'posts'));
  });
  document.getElementById('topbar-title').textContent = TOPBAR_TITLES[page] || 'CMS';

  if (page === 'ai-engine') {
    fetchAIStatus(false);
    state.pollTimer = setInterval(() => {
      if (state.page === 'ai-engine') {
        fetchAIStatus(true);
      } else {
        clearInterval(state.pollTimer);
        state.pollTimer = null;
      }
    }, 4000);
  }

  render();
}

// ── Helpers ──────────────────────────────────────────────────────────────────
function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
function toSlug(t) { return t.toLowerCase().replace(/[^a-z0-9\s-]/g,'').trim().replace(/\s+/g,'-'); }
function catBadge(cat) { return `<span class="badge ${CAT_CLS[cat] || ''}">${esc(CAT_LABELS[cat] || cat)}</span>`; }
function fmtDate(d) { if (!d) return '—'; try { return new Date(d).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}); } catch { return d; } }
function wordCount(s) { return (s || '').split(/\s+/).filter(Boolean).length; }
function charCls(len, min, max) { return len < min ? 'char-warn' : len <= max ? 'char-ok' : 'char-bad'; }

// ── SEO calculator ───────────────────────────────────────────────────────────
function calcSeo(p) {
  const wc = wordCount(p.body);
  const checks = [
    { label: 'Title: 50–65 chars (ideal for Google)', pass: p.title.length >= 40 && p.title.length <= 65, tip: `Currently ${p.title.length} chars` },
    { label: 'Description: 120–160 chars', pass: p.description.length >= 100 && p.description.length <= 160, tip: `Currently ${p.description.length} chars` },
    { label: 'Has hero image URL', pass: !!p.image, tip: 'Add an image URL' },
    { label: 'Has image alt text', pass: !!p.imageAlt, tip: 'Describe the image for screen readers & Google' },
    { label: 'Has 2 or more tags', pass: (p.tags||[]).length >= 2, tip: 'Tags help with topical authority' },
    { label: 'Has author name', pass: !!p.author, tip: 'Google E-E-A-T: authorship matters' },
    { label: 'Has author image', pass: !!p.authorImage, tip: 'Add an author avatar for premium branding' },
    { label: 'Slug is URL-friendly', pass: /^[a-z0-9][a-z0-9-]*$/.test(p.slug || ''), tip: 'Only lowercase letters, numbers, hyphens' },
    { label: 'Content 300+ words', pass: wc >= 300, tip: `Currently ${wc} words (300+ recommended)` },
    { label: 'Has category set', pass: !!p.category, tip: 'Category creates topical clusters' },
  ];
  const score = Math.round((checks.filter(c => c.pass).length / checks.length) * 100);
  return { score, checks };
}

function seoHTML(post) {
  const { score, checks } = calcSeo(post);
  const cls = score >= 80 ? 'seo-score-good' : score >= 50 ? 'seo-score-ok' : 'seo-score-bad';
  const label = score >= 80 ? 'Great!' : score >= 50 ? 'Needs work' : 'Poor';
  return `
    <div class="seo-panel">
      <div class="flex items-center gap-3 mb-4">
        <div class="seo-score-ring ${cls}">${score}</div>
        <div>
          <div style="font-weight:700;font-size:14px">SEO Score</div>
          <div class="text-mute">${label}</div>
        </div>
      </div>
      ${checks.map(c => `
        <div class="seo-check">
          <span class="seo-icon">${c.pass ? '✅' : '⚠️'}</span>
          <div>
            <div style="font-size:12px;font-weight:${c.pass ? 400 : 600};color:${c.pass ? '#444' : '#b45309'}">${esc(c.label)}</div>
            ${!c.pass ? `<div style="font-size:11px;color:#999;margin-top:2px">${esc(c.tip)}</div>` : ''}
          </div>
        </div>
      `).join('')}
    </div>
  `;
}

// ── Editor interaction handlers ──────────────────────────────────────────────
function onTitleInput(el) {
  editorPost.title = el.value;
  if (!editorSlugEdited) { editorPost.slug = toSlug(el.value); document.getElementById('ed-slug').value = editorPost.slug; }
  const len = el.value.length;
  const cls = charCls(len, 40, 65);
  const hint = len >= 40 && len <= 65 ? '✓ SEO-optimal' : len > 65 ? '— too long for Google' : '— aim for 50+';
  document.getElementById('ed-title-counter').className = `char-counter ${cls}`;
  document.getElementById('ed-title-counter').textContent = `${len}/65 chars ${hint}`;
  refreshSeo();
}

function onDescInput(el) {
  editorPost.description = el.value;
  const len = el.value.length;
  const cls = charCls(len, 100, 160);
  const hint = len >= 100 && len <= 160 ? '✓ SEO-optimal' : len > 160 ? '— too long, will be truncated' : '— too short';
  document.getElementById('ed-desc-counter').className = `char-counter ${cls}`;
  document.getElementById('ed-desc-counter').textContent = `${len}/160 chars ${hint}`;
  refreshSeo();
}

function onSlugInput(el) {
  editorSlugEdited = true;
  const clean = el.value.toLowerCase().replace(/\s+/g, '-').replace(/[^a-z0-9-]/g, '');
  editorPost.slug = clean;
  el.value = clean;
  refreshSeo();
}

function onBodyInput(el) {
  editorPost.body = el.value;
  document.getElementById('ed-word-count').textContent = wordCount(el.value) + ' words';
  refreshSeo();
}

function refreshSeo() {
  const panel = document.getElementById('seo-panel');
  if (panel) panel.innerHTML = seoHTML(editorPost);
}

function refreshImagePreview() {
  const card = document.getElementById('image-preview-card');
  const body = document.getElementById('image-preview-body');
  if (!card || !body) return;
  if (editorPost.image) {
    card.classList.remove('hidden');
    body.innerHTML = `<img src="${esc(editorPost.image)}" alt="${esc(editorPost.imageAlt)}" style="width:100%;border-radius:6px;aspect-ratio:16/9;object-fit:cover" onerror="this.style.display='none'" />`;
  } else {
    card.classList.add('hidden');
  }
}

function refreshWeeklyNote() {
  const note = document.getElementById('weekly-note');
  if (note) note.classList.toggle('hidden', !editorPost.weeklyHighlight);
}

// ── Tag input ────────────────────────────────────────────────────────────────
function renderTags() {
  const wrap = document.getElementById('tags-wrap');
  if (!wrap) return;
  wrap.innerHTML = editorPost.tags.map(t =>
    `<span class="tag-chip">${esc(t)}<button onclick="removeTag('${esc(t)}')">×</button></span>`
  ).join('') + `<input class="tag-input" id="tag-input" placeholder="${editorPost.tags.length ? '' : 'Add tags, press Enter…'}" onkeydown="onTagKey(event)" onblur="onTagBlur(this)" />`;
}

function addTag(val) {
  const t = (val || '').trim().toLowerCase().replace(/\s+/g, '-');
  if (t && !editorPost.tags.includes(t)) {
    editorPost.tags.push(t);
    refreshSeo();
  }
  renderTags();
  const input = document.getElementById('tag-input');
  if (input) input.focus();
}

function onTagBlur(input) {
  if (input && input.value && input.value.trim()) {
    addTag(input.value);
  }
}

function removeTag(tag) {
  editorPost.tags = editorPost.tags.filter(t => t !== tag);
  refreshSeo();
  renderTags();
}

function onTagKey(e) {
  if ((e.key === 'Enter' || e.key === ',') && e.target.value.trim()) {
    e.preventDefault();
    addTag(e.target.value);
  }
  if (e.key === 'Backspace' && !e.target.value && editorPost.tags.length) {
    editorPost.tags.pop();
    refreshSeo();
    renderTags();
  }
}

// ── Image upload handler ─────────────────────────────────────────────────────
async function handleUpload(input, field, targetInputId) {
  const file = input.files[0];
  if (!file) return;
  showToast('Uploading…');
  try {

// ── Markdown toolbar helpers ─────────────────────────────────────────────────
function mdInsert(before, after) {
  const ta = document.getElementById('ed-body');
  if (!ta) return;
  const start = ta.selectionStart, end = ta.selectionEnd;
  const sel = ta.value.substring(start, end);
  const replacement = before + (sel || 'text') + after;
  ta.setRangeText(replacement, start, end, 'select');
  ta.focus();
  editorPost.body = ta.value;
}

function mdInsertLink() {
  const url = prompt('Enter URL:');
  if (url) mdInsert('[', `](${url})`);
}

function mdInsertImage() {
  const url = prompt('Enter image URL:');
  if (url) { const ta = document.getElementById('ed-body'); ta.setRangeText(`\n![alt text](${url})\n`, ta.selectionStart, ta.selectionEnd, 'end'); editorPost.body = ta.value; ta.focus(); }
}

// ── Save post ────────────────────────────────────────────────────────────────
async function savePost(isDraft) {
  if (!editorPost.title) { showToast('Title is required', 'error'); return; }
  if (!editorPost.slug) { showToast('Slug is required', 'error'); return; }

  const btnDraft = document.getElementById('btn-save-draft');
  const btnPub = document.getElementById('btn-publish');
  btnDraft.disabled = true; btnPub.disabled = true;

  const isEdit = !!state.editData;
  const payload = { ...editorPost, draft: isDraft };

  try {
    const url = isEdit ? `${API}/posts/${state.editData.slug}` : `${API}/posts`;
    const method = isEdit ? 'PUT' : 'POST';
    if (isEdit) payload.newSlug = editorPost.slug;

    const res = await fetch(url, {
      method,
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
    });
    const data = await res.json();
    if (!res.ok) { showToast(data.error || 'Save failed', 'error'); return; }
    showToast(isDraft ? 'Draft saved!' : (isEdit ? 'Post updated & published!' : 'Post published!'));
    await fetchPosts();
    navigateTo('posts');
  } catch {
    showToast('Network error: is the server running?', 'error');
  } finally {
    btnDraft.disabled = false; btnPub.disabled = false;
  }
}

  try {

async function parseJSONResponse(res) {
  const text = await res.text();
  try {
    const data = JSON.parse(text);
    if (!res.ok) throw new Error(data.error || `Server error (${res.status})`);
    return data;
  } catch (err) {
    if (err.message && !err.message.includes('JSON')) throw err;
    const match = text.match(/<title>([^<]+)<\/title>/i);
    const title = match ? match[1].replace(/^(Error|SyntaxError):\s*/i, '') : '';
    throw new Error(title || `Server returned status ${res.status}`);
  }
}

async function submitBatchTopics(generateImmediately = false) {
  syncAIDraftsFromDOM();
  const ta = document.getElementById('ai-topics-input');
  const catSel = document.getElementById('ai-topics-category');
  const raw = (ta ? ta.value : (state.aiTopicsDraft || '')).trim();

  // If textarea is empty and user clicked Generate Now, trigger next pending item or auto-load samples
  if (!raw && generateImmediately) {
    const nextPending = (state.aiConfig?.queue || []).find(q => q.status === 'pending');
    if (nextPending) {
      runTopicPipeline(nextPending.id);
      return;
    }
    loadSampleTopics();
    showToast('Loaded sample topics! Click "Generate Now" again to run.', 'success');
    return;
  }

  const lines = raw.split('\n').map(l => l.trim()).filter(Boolean);
  if (lines.length === 0) {
    showToast('Please enter at least one topic or click "💡 Load Samples"', 'error');
    if (ta) ta.focus();
    return;
  }

  const category = catSel ? catSel.value : (state.aiCategoryDraft || 'tech-ai');

  try {
    const res = await fetch(`${API}/ai/queue`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ topics: lines, category }),
    });
    const data = await parseJSONResponse(res);

    // ONLY clear draft upon successful submission!
    state.aiTopicsDraft = '';
    if (ta) ta.value = '';
    const countEl = document.getElementById('ai-topics-count');
    if (countEl) countEl.textContent = '0 topics';

    await fetchAIStatus(true);

    if (generateImmediately) {
      const targetId = (data.items && data.items[0]?.id) || (data.queue && data.queue[data.queue.length - 1]?.id);
      if (targetId) {
        showToast(`Starting real-time generation for "${lines[0]}"...`, 'success');
        runTopicPipeline(targetId);
      }
    } else {
      showToast(`Added ${data.added} topic(s) to the queue!`, 'success');
    }
  } catch (err) {
    showToast(err.message, 'error');
  }
}

          <div id="trend-scan-status" style="font-size:12px; font-weight:500; color:${state.lastTrendResult?.error ? '#dc2626' : (state.lastTrendResult ? '#16a34a' : '#6b7280')};">
            ${state.lastTrendResult && !state.lastTrendResult.error
              ? `Last scan: ${state.lastTrendResult.discovered} trends found → ${state.lastTrendResult.selected || 0} selected → ${state.lastTrendResult.added} added to queue`
              : state.lastTrendResult?.error
                ? `Error: ${esc(state.lastTrendResult.error)}`
                : 'Click to scan trending topics and auto-populate your queue with high-traffic subjects.'}
          </div>
        </div>
        <button id="btn-discover-trends" class="btn btn-grad" style="white-space:nowrap; min-width:180px; justify-content:center; ${state.trendDiscovering ? 'opacity:.7; pointer-events:none;' : ''}" onclick="discoverTrendsUI()">
          ${state.trendDiscovering ? '<span class="spinner" style="width:14px;height:14px;border-width:2px;margin-right:6px;"></span> Scanning…' : '🔍 Discover Trends Now'}
        </button>
      </div>
      <div id="trend-chips-container" style="display:${state.lastTrendResult?.topics?.length > 0 ? 'block' : 'none'}; border-top:1px solid #dbeafe; padding:12px 16px; background:#f8fafc;">
        <div style="font-size:11px; font-weight:600; color:#1e40af; margin-bottom:8px; text-transform:uppercase; letter-spacing:.5px;">Just Added to Queue:</div>
        <div id="trend-chips-list" style="display:flex; flex-wrap:wrap; gap:6px;">
          ${(state.lastTrendResult?.topics || []).map(t => `
            <span style="display:inline-flex; align-items:center; gap:4px; padding:4px 10px; background:#fff; border:1px solid #e5e7eb; border-radius:6px; font-size:11px; font-weight:500;">
              ${catBadge(t.category)} ${esc(t.topic)}
            </span>
          `).join('')}
        </div>
      </div>
    </div>

    <!-- TOP SECTION: BATCH INGESTION & SETTINGS -->
    <div style="display:grid; grid-template-columns: 1.25fr 1fr; gap: 20px; margin-bottom: 24px;">
      
      <!-- CARD 1: Line-by-Line Batch Topic Ingestion -->
      <div class="card">
        <div class="card-header">
          <div>
            <span class="card-title">Batch Topic Ingestion (Line by Line)</span>
            <div class="text-mute" style="font-size:11px; margin-top:2px;">Enter 10, 50, or 100 topics — one topic per line.</div>
          </div>
          <span class="badge badge-tech">Auto-Queued</span>
        </div>
        <div class="card-body">
          <div class="form-group mb-4">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;">
              <label class="form-label" style="margin-bottom:0;">Topics List (1 Topic Per Line)</label>
              <div style="display:flex; align-items:center; gap:6px;">
                <span id="ai-topics-count" style="font-size:11px; font-weight:600; color:var(--mute); margin-right:4px;">${(state.aiTopicsDraft || '').split('\n').filter(l => l.trim()).length} topic(s)</span>
                <button type="button" class="btn btn-secondary btn-sm" onclick="loadSampleTopics()" style="padding:2px 8px; font-size:11px; height:24px; border-radius:4px;" title="Insert 5 sample topics to test immediately">💡 Load Samples</button>
                <button type="button" class="btn btn-secondary btn-sm" onclick="clearTopicsInput()" style="padding:2px 8px; font-size:11px; height:24px; border-radius:4px;" title="Clear input">✕ Clear</button>
              </div>
            </div>
            <textarea id="ai-topics-input" rows="7" placeholder="Type or paste topics here — one topic per line (or click '💡 Load Samples' above)..." oninput="onTopicsInput(this)">${esc(state.aiTopicsDraft || '')}</textarea>
          </div>
          <div style="display:grid; grid-template-columns: 1fr 1.6fr; gap: 12px; align-items:end;">
            <div class="form-group">
              <label class="form-label">Category</label>
              <select id="ai-topics-category" onchange="state.aiCategoryDraft=this.value">
                <option value="tech-ai" ${state.aiCategoryDraft==='tech-ai'?'selected':''}>Tech & AI</option>
                <option value="memes-trends" ${state.aiCategoryDraft==='memes-trends'?'selected':''}>Memes & Trends</option>
                <option value="creators" ${state.aiCategoryDraft==='creators'?'selected':''}>Creators</option>
                <option value="movies-ott" ${state.aiCategoryDraft==='movies-ott'?'selected':''}>Movies & OTT</option>
              </select>
            </div>
            <div style="display:grid; grid-template-columns: 1fr 1fr; gap: 8px;">
              <button class="btn btn-primary" style="justify-content:center;" onclick="submitBatchTopics(false)">
                ＋ Add Topics to Queue
              </button>
              <button class="btn btn-grad" style="justify-content:center;" onclick="submitBatchTopics(true)">
                ⚡ Generate Now
              </button>
            </div>
          </div>
        </div>
      </div>

      <!-- CARD 2: Automation & Schedule Settings -->
      <div class="card">
        <div class="card-header">
          <span class="card-title">Automation & Schedule Settings</span>
          <div class="toggle-row" onclick="toggleAutopilot()">
            <span style="font-size:12px; font-weight:600;">Autopilot</span>
            <div class="toggle ${isAutopilot ? 'on' : ''}" id="ai-autopilot-toggle"></div>
          </div>
        </div>
        <div class="card-body">
          <div style="display:grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px;">
            <div class="form-group">
              <label class="form-label">Morning Slot (Slot 1)</label>
              <input type="time" id="ai-morning-time" value="${esc(state.aiMorningDraft !== null ? state.aiMorningDraft : (ai.settings.morningTime || '09:00'))}" oninput="state.aiMorningDraft=this.value" />
            </div>
            <div class="form-group">
              <label class="form-label">Evening Slot (Slot 2)</label>
              <input type="time" id="ai-evening-time" value="${esc(state.aiEveningDraft !== null ? state.aiEveningDraft : (ai.settings.eveningTime || '19:00'))}" oninput="state.aiEveningDraft=this.value" />
            </div>
          </div>

          <div style="display:grid; grid-template-columns: 1fr 1.3fr; gap: 12px; margin-bottom: 12px;">
            <div class="form-group">
              <label class="form-label">Provider</label>
              <select id="ai-provider" disabled style="background:var(--surface); cursor:default; font-weight:600;">
                <option value="groq" selected>Groq (Ultra-Fast LPUs)</option>
              </select>
            </div>
            <div class="form-group">
              <label class="form-label">Groq Model</label>
              <select id="ai-model">
                ${GROQ_MODELS.map(m => `
                  <option value="${esc(m.id)}" ${m.id === currentModel ? 'selected' : ''}>${esc(m.label)}</option>
                `).join('')}
              </select>
            </div>
          </div>

          <div style="margin-bottom:12px; padding:10px 14px; background:#f0fdf4; border:1px solid #bbf7d0; border-radius:6px; display:flex; align-items:center; gap:8px;">
            <span style="color:#16a34a; font-size:14px; font-weight:700;">✓</span>
            <span style="font-size:12px; color:#15803d; font-weight:500;">LLM connected via <code style="font-family:'Courier New',monospace; background:#dcfce7; padding:1px 5px; border-radius:4px;">frontend/.env</code></span>
          </div>

          <div style="margin-top:10px; padding-top:12px; border-top:1px solid var(--border);">
            <div style="font-size:12px; font-weight:700; color:var(--ink); margin-bottom:8px; display:flex; align-items:center; justify-content:space-between;">
              <span style="display:flex; align-items:center; gap:6px;">
                🖼️ Free Hero Image Engine
                <span style="font-size:10px; padding:1px 6px; background:#ecfdf5; color:#047857; border-radius:10px; font-weight:600; border:1px solid #a7f3d0;">100% Free • Zero-Key</span>
              </span>
            </div>
            <div style="background:#f8fafc; border:1px solid #e2e8f0; border-radius:6px; padding:10px 12px; margin-bottom:12px; font-size:11px; line-height:1.5; color:#475569;">
              <div style="font-weight:600; color:#1e293b; margin-bottom:6px;">
                🌐 Multi-Platform Free Visual Sourcing:
              </div>
              <div style="display:flex; flex-wrap:wrap; gap:5px; margin-bottom:8px;">
                <span class="badge" style="background:#eff6ff; color:#1d4ed8; border:1px solid #bfdbfe; font-size:10px;">Wikipedia Entities</span>
                <span class="badge" style="background:#f5f3ff; color:#6d28d9; border:1px solid #ddd6fe; font-size:10px;">Wikimedia Commons</span>
                <span class="badge" style="background:#f0fdf4; color:#15803d; border:1px solid #bbf7d0; font-size:10px;">Pollinations HD Visuals</span>
                <span class="badge" style="background:#fffbeb; color:#b45309; border:1px solid #fde68a; font-size:10px;">Unsplash Open</span>
              </div>
              <div style="color:#64748b; font-size:10.5px;">
                Auto-downloads & verifies 1200px landscape hero images straight to <code style="font-family:'Courier New',monospace; background:#e2e8f0; padding:1px 4px; border-radius:3px;">/images/</code>. Zero keys required, zero broken links.
              </div>
            </div>
          </div>

          <button class="btn btn-secondary" style="width:100%; justify-content:center;" onclick="saveSettingsForm()">
            Save Schedule & AI Settings
          </button>
        </div>
      </div>
    </div>

    <!-- CARD 3: TOPIC PRODUCTION QUEUE -->
    <div class="card mb-6" id="ai-queue-card">
      <div class="card-header">
        <div class="flex items-center gap-2">
          <span class="card-title">Topic Production Queue</span>
          <span class="badge badge-draft" id="ai-queue-count">${ai.queue.length} Total</span>
        </div>
        <div class="flex items-center gap-2">
          <button class="btn btn-secondary btn-sm" onclick="clearCompleted()">Clear Completed</button>
        </div>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th style="width:40px">#</th>
              <th>Topic</th>
              <th>Category</th>
              <th>Status</th>
              <th>Created</th>
              <th style="text-align:right">Action</th>
            </tr>
          </thead>
          <tbody id="ai-queue-tbody">
            ${renderQueueRowsHTML(ai)}
          </tbody>
        </table>
      </div>
    </div>

    <!-- CARD 4: LIVE 4-STEP AGENT TERMINAL -->
    <div class="card">
      <div class="card-header">
        <div class="flex items-center gap-2">
          <span class="card-title">Live 4-Step LLM Agent Activity Log</span>
          <span class="dot"></span>
        </div>
        <span class="text-mute font-mono" style="font-size:11px;">Scout → Writer → Auditor → Stock Image</span>
      </div>
      <div style="background:#0d0d0d; color:#22c55e; padding:16px; font-family:'Courier New',monospace; font-size:12px; height:200px; overflow-y:auto; border-radius: 0 0 var(--radius) var(--radius); line-height:1.6;" id="ai-terminal">
        ${renderLogsHTML(ai.logs)}
      </div>
    </div>
  `;
}

// ═══════════════════════════════════════════════════════════════════════════════
// MAIN RENDER
// ═══════════════════════════════════════════════════════════════════════════════

function render() {
  const app = document.getElementById('app-content');

  if (state.loading) {
    app.innerHTML = '<div class="empty" style="padding-top:80px"><div class="spinner" style="margin:0 auto 16px"></div><p>Loading posts…</p></div>';
    return;
  }

  switch (state.page) {
    case 'dashboard': app.innerHTML = renderDashboard(); break;
    case 'posts':     app.innerHTML = renderPostsList(); break;
    case 'ai-engine': app.innerHTML = renderAIEngine(); break;
    case 'new':       app.innerHTML = renderEditor(); break;
    case 'edit':      app.innerHTML = renderEditor(); break;
    default:          app.innerHTML = renderDashboard();
  }

  // Post-render hooks
  if (state.page === 'new' || state.page === 'edit') {
    renderTags();
    const t = document.getElementById('ed-title');
    if (t) onTitleInput(t);
    const d = document.getElementById('ed-desc');
    if (d) onDescInput(d);
    refreshImagePreview();
  }
}

// ── Boot ─────────────────────────────────────────────────────────────────────
(async () => {
  render(); // show loading
  await fetchPosts();
  render(); // show dashboard
})();
</script>

</body>
</html>
